<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-toolbar>
  <span class="brand-mark" aria-hidden="true">M</span>
  <span>Merchant Portal</span>
</mat-toolbar>

<main id="main-content" tabindex="-1">
  <p class="eyebrow">Merchant onboarding</p>
  <h1>{{ title() }}</h1>
  <p class="introduction">
    A shared workspace for submitting merchant applications and managing their review.
  </p>

  <section class="workflow" aria-label="Application workflow">
    @for (step of workflow; track step.role) {
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-subtitle>{{ step.role }}</mat-card-subtitle>
          <mat-card-title>{{ step.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ step.description }}</p>
        </mat-card-content>
      </mat-card>
    }
  </section>
  <router-outlet />
</main>
